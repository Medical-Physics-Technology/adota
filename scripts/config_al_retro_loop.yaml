# Retrospective active-learning benchmark on the training HDF5 (EXP-0012)
# =========================================================================
#   uv run python scripts/al_retro_loop.py splits --config scripts/config_al_retro_loop.yaml
#   uv run python scripts/al_retro_loop.py cycle0 --config scripts/config_al_retro_loop.yaml --device-index 0
#   uv run python scripts/al_retro_loop.py run    --config scripts/config_al_retro_loop.yaml \
#       --strategy random --cycle0-run <cycle-0 run dir> --device-index 0
#   Any key can be overridden on the command line with --set KEY=VALUE (dotted for
#   nested blocks); the smoke test is this file plus the --set list in the guide.
#
# EXP-0012 is EXP-0011 with two changes.
#   1. A 5-epoch linear warmup at the start of every cycle: the learning rate
#      rises from lr_min to 5e-4 over epochs 0 to 4, then decays by cosine back
#      to lr_min by epoch 49. EXP-0011's warm restart (lr_min straight back to
#      5e-4 at epoch 0) was itself a divergence: the training loss jumped 40-fold
#      (random), 67-fold (score_topk) and 50-fold (score_topk_mixed) into cycle 2,
#      and the strategy ranking followed that shock. restart_ratios.csv of
#      al_compare.py checks that the jump is removed and not only delayed.
#   2. A patient-held-out validation set on the v3 HDF5. EXP-0009 to EXP-0011
#      drew V record by record, so V shared 55 of its 55 CT scans with T and
#      measured new beamlets of seen patients only. Here 12 whole CT scans (9
#      thorax, 3 pelvis, about 20 percent) are held out by `patient_key`, the
#      per-record scan id v3 carries; a patient scanned twice would count as two.
# New splits mean a new cycle 0: it is trained fresh on these splits at the
# constant 5e-4 for 50 epochs that EXP-0009's cycle 0 ran, via
#   CYCLE0_ARGS="--set lr_schedule=constant --set warmup_epochs=0"
# on scripts/run_al_retro.sh; the strategy runs use the schedule below. Same
# three strategies (random, score_topk, score_topk_mixed) and three seeds, 1234,
# 1235 and 1236 (`--seed`, or SEEDS for scripts/run_al_retro.sh). The absolute
# numbers are not comparable with EXP-0009 to EXP-0011 (different V).
#
# The labels already exist; the loop hides them and reveals them only for the
# records a strategy selects. No Monte Carlo, no candidate generation, no cost
# axis: the question is how the sampling strategy shapes the training progress.
# Guide: scripts/docs/al_retro_loop.md. Design: docs/active_learning_pipeline.md.

experiment: EXP-0012

# ── Data ──────────────────────────────────────────────────────────────────
# v3 (CHG-0011): the v2 records byte for byte plus per-record provenance
# (patient_key, source_dataset, ...), read from the index CSV beside the file.
dataset_path: /scratch/mstryja/DoTA_dataset_v3/trainset_pelvis_initial_test_one_ct_downsampled_v3_all_SingleGaussian.h5
# Mandatory. A missing file is an error, never an unfiltered set. A copy is
# vendored at data/excluded_indexes/ and cross-checked against this one. v3 was
# built with this list applied, so on v3 it drops nothing; it stays for the
# manifest fingerprint and because the loader opens it.
exclude_indexes_path: /home/mstryja/projects/dota_pytorch/auxilary_files/IndexesExclude_trainset_pelvis_initial_test_one_ct_downsampled_v2_all_SingleGaussian.txt
# sample_id -> anatomy, patient_key of the difficulty study; feeds the selection
# fingerprint. Optional: without it patient and anatomy read "unknown".
record_provenance_csv: /scratch/mstryja/adota_runs/20260707_124010/figures/acquisition/uuid_provenance_map.csv

# ── Scale of the experiment ───────────────────────────────────────────────
# data_fraction is the share of D (the set after exclusion) the experiment
# uses, drawn once with data_fraction_seed before any split; V, T, the cycle-0
# set and the pool all come from that subset. 0.30 is the fast pilot (gamma on
# the full validation set at every boundary is the cost driver); 0.4, 0.5, 0.6
# and 1.0 are the planned scale-ups. Give every fraction its own splits_dir and
# runs_dir; the run name carries d<percent>.
data_fraction: 0.30
data_fraction_seed: 20260911

# ── Splits (written once by the `splits` stage, read by every run) ─────────
# New patient-held-out splits of v3 at d30. The d30 subset is drawn record by
# record first (data_fraction_seed), then V = every d30 record of the 12
# held-out scans (split_seed), T = the rest, the cycle-0 set from T record by
# record (initial_seed). The `splits` stage refuses to overwrite them.
splits_dir: /scratch/mstryja/adota_runs/al_retro_v3/d30_patient/splits
runs_dir: /scratch/mstryja/adota_runs/al_retro_v3/d30_patient/exp0012
val_split: patient        # record (EXP-0009 to EXP-0011) | patient
val_group_column: patient_key
val_stratify_column: source_dataset
val_groups_per_stratum:   # 12 of 56 scans; V and T share none
  initial_test_one_ct: 9  # of 40 thorax scans
  trainset_pelvis: 3      # of 16 pelvis scans
val_fraction: 0.15        # unused under val_split: patient
initial_fraction: 0.20    # the cycle-0 set, drawn from T the same way
split_seed: 42
initial_seed: 20260910
max_records: null         # smoke tests only

# ── The loop ──────────────────────────────────────────────────────────────
batch_fraction: 0.10      # N = 10 percent of |T| per cycle
n_cycles: 5
epochs_per_cycle: 50
eval_every_n_epochs: 5    # full metric set on the subsample; loss every epoch on all of V
eval_subsample_size: 1000
eval_subsample_seed: 20260910
strategy: random          # random | score_topk | score_topk_mixed (override on the CLI)
strategy_params: {}       # forwarded to the strategy as keyword args; score_topk_mixed's
                           # default is {top_fraction: 0.5}, random and score_topk take none
seed: 1234               # EXP-0012 runs 1234, 1235 and 1236 (SEEDS="1234 1235 1236")
device_index: 0
checkpoint_every_n_epochs: 10

# lr_schedule: plateau (ReduceLROnPlateau on the validation loss, state carried
# across cycles; what EXP-0009 ran), constant (training.learning_rate held fixed
# every epoch; what EXP-0010 ran), or cosine_per_cycle (cosine decay from
# training.learning_rate to lr_min over each cycle, warm-restarting every cycle).
# EXP-0011 used `cosine_per_cycle`, 5e-4 to 5e-5: a pure function of the epoch,
# so identical for every strategy, with the model at a low learning rate when
# the boundary is measured, which is where EXP-0010's within-cycle oscillation
# and both mid-cycle divergences lived. Its warm restart was a 40 to 67-fold
# shock to the training loss, so EXP-0012 keeps the cosine and adds
# warmup_epochs: 5, a linear rise from lr_min (epoch 0, exactly where the
# previous cycle ended) to training.learning_rate (epoch 5), after which the
# cosine decays to lr_min at the last epoch. Still a pure function of the epoch,
# so mid-cycle resume stays exact. warmup_epochs must be smaller than
# epochs_per_cycle and is rejected under plateau; 0 is no warmup. The shared
# cycle 0 stays the constant-LR endpoint of EXP-0009; it is common to every run
# and cancels (cycle 1 now starts from lr_min instead of 5e-4, a drop, not a
# shock).
lr_schedule: cosine_per_cycle
lr_min: 0.00005
warmup_epochs: 5

# ── Scoring (cycle 1 onward, on the fly, through the scorer interface) ────
scorer:
  name: difficulty
  scorer_path: src/acquisition/data/analytic_scorer.json   # DifficultyScorer.load default
  variant: "full (ridge)"
  arm: null
  n_workers: 12

# ── Validation metrics ────────────────────────────────────────────────────
# 2%/2mm with a 10 percent dose cutoff on the torch backend; named in every
# filename and caption.
gamma_params:
  dose_percent_threshold: 2
  distance_mm_threshold: 2
  interp_fraction: 10
  max_gamma: 2
  lower_percent_dose_cutoff: 10
  random_subset: null
  local_gamma: false
  quiet: true
gamma_resolution_mm: [2.0, 2.0, 2.0]
gamma_cutoff_percent: 10.0
gamma_backend: torch

# ── Training (TrainingConfig fields; the model is trained from scratch) ───
training:
  scale:
    min_ds: 0.0
    max_ds: 25277028.0
    min_ct: -1024
    max_ct: 3071
    min_energy: 70.0
    max_energy: 270.0
  batch_size: 56
  num_workers: 4
  augmentation: true
  normalize_flux_only: true
  learning_rate: 0.0005
  weight_decay: 0.001
  lr_factor: 0.9          # only used under lr_schedule: plateau
  lr_patience: 20         # only used under lr_schedule: plateau
  compile: true             # both relax cuDNN determinism; turn off for a bit-exact resume check
  compile_mode: default
  allow_tf32: true
  initial_weight_mse: 0.7
  initial_weight_ps: 0.3
  balancer_smoothing: 0.9
  adaptive_after_epoch: 10000
  loss_mode: mse_idd
  lps_dx_mm: 2.0
  lps_dy_mm: 2.0
  input_shape: [2, 160, 30, 30]
  num_transformers: 1
  num_heads: 4
  dim_feedforward: null
  num_levels: 4
  enc_features: 32
  kernel_size: 3
  convolutional_steps: 2
  conv_hidden_channels: 64
  dropout_rate: 0.1
  causal: true
  zero_padding: true
  last_activation: false
  num_forward: 2
  weight_standardization: false
  norm_layer: batch
  weight_init: default
