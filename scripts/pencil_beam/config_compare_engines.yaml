# MC vs DoseCUDA pencil beam vs ADoTA on the same CT grid
# ========================================================
#   uv run python scripts/pencil_beam/compare_engines.py \
#       --config scripts/pencil_beam/config_compare_engines.yaml [--dry-run]
#
# Beamlet selection uses the generator's own blocks (datasets + robustness), so a
# comparison beamlet is built exactly like a training beamlet. Guide:
# scripts/docs/compare_engines.md

name: engine_comparison
output_dir: /scratch/mstryja/pencil_beam/engine_comparison/smoke

datasets:
  - name: NSCLC-Radiomics
    anatomy: thoracic
    root: /scratch/mstryja/manifest-1603198545583
    n_patients: 1
    selection: last
  - name: Prostate-AEC
    anatomy: pelvic
    root: /scratch/mstryja/manifest-1684259732535
    n_patients: 1
    selection: last

robustness:
  energies: [102.6, 160.0]
  angles: [[0.0, 0.0], [-2.0, -2.0], [2.0, 2.0]]   # centre + two corners
  theta_x_range: [-2.0, 2.0]
  theta_y_range: [-2.0, 2.0]
  grid_n: 19                        # odd so 0 deg is a cell (the 18x18 dataset lattice has none)
  gantry_mode: fixed
  gantry_value: 90.0
  rotate_to_canonical: true
  roi_size: [60, 60, 320]
  iso_spacing_mm: 1.0
  num_primaries: 1.0e7
  num_threads: 16
  rng_seed: 0
  min_deposition_ratio: 0.5
  make_figures: false               # the dataset's per-beamlet QC figure

engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/engine_comparison
  bdl_file: hptc_beam_model_rsnone.txt
  scanner: default

pencil_beam:
  dosecuda_kernels: /home/mstryja/tools/dosecuda/current/dose_kernels.so
  model_dir: /home/mstryja/tools/dosecuda/models/hptc_rsnone_mcsquare_v2
  gpu_id: 0

adota:
  model_dir: /home/mstryja/projects/adota/models/DoTA_v3_grid_search_v11
  fname: best_model.pth
  device_index: 0
  batch_size: 56

comparison:
  gamma_criteria:                   # 3%/3mm/10% headline, global, normalised to the MC max
    - {dose: 3, dist: 3, cutoff: 10}
    - {dose: 2, dist: 2, cutoff: 10}
    - {dose: 1, dist: 1, cutoff: 10}
  gamma_local: false
  gamma_backend: pymedphys
  lateral_margin_mm: 30             # comparison window = ADoTA ROI + this much each lateral side
  make_figures: true
