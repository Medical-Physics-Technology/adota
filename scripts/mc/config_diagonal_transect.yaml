# Appendix A.6: one-figure summary of the anti-diagonal transect through the
# 18x18 beamlet-angle grid (thoracic LUNG1-006, 80 MeV). Reads only arrays that
# already exist in the robustness experiment dir plus the persisted gamma grids.
exp_dir: /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_thoracic_LUNG1-006_e80_v2
grids_npz: /scratch/mstryja/DoTA_dataset_v2/robustness_figures_combined/grids/thoracic_LUNG1-006_e80_grids.npz
criterion_key: g1_3_0p1
grid_n: 18
theta_range: [-2.0, 2.0]
# Depth window along the field axis [mm]; null -> derived from the data.
depth_lim: [30.0, 258.0]
# Regime divider (between position 10 and 11) and the brackets drawn above (b).
transition: 10.5
regimes:
  - [0, 9, "long path, lung-dominated"]
  - [11, 17, "short path, dense distal end"]
# Keep the annotated pairs well apart: at print size a one-line pair is ~1.2 in.
annotate_positions: [0, 6, 11, 17]
# (a) is written as its own file; (b)-(f) as a second one.
angle_map_figure:
  width_in: 3.8
  height_in: 3.1
  dpi: 300
  font_scale: 1.3
transect_figure:
  width_in: 7.1
  height_in: 8.6
  dpi: 300
  font_scale: 1.3
output_dir: /scratch/mstryja/DoTA_dataset_v2/robustness_figures_combined/diagonal_thoracic_LUNG1-006_e80
figure_stem: diagonal_transect_thoracic_LUNG1-006_e80
# Per-position metrics table written next to the figure.
write_metrics_csv: true
