# QC config: 3x3 grid, 1 patient x 2 anatomies x 1 energy, per-beamlet figures.
# For visual assessment of MC quality. Run:
#   uv run python scripts/mc/beamlet_angle_robustness.py \
#       --config scripts/mc/config_qc_3x3.yaml --grid-n 3 --make-figures --num-primaries 2e5
name: robustness_qc
datasets:
  - name: NSCLC-Radiomics
    anatomy: thoracic
    root: /scratch/mstryja/manifest-1603198545583
    n_patients: 1
  - name: Prostate-AEC
    anatomy: pelvic
    root: /scratch/mstryja/manifest-1684259732535
    n_patients: 1
engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/robustness_qc
  bdl_file: hptc_beam_model_rsnone.txt
robustness:
  energies: [140.0]
  grid_n: 3
  gantry_mode: fixed
  gantry_value: 90.0
  roi_size: [60, 60, 320]
  num_primaries: 2.0e5
  num_threads: 0
  min_deposition_ratio: 0.5
  output_root: /scratch/mstryja/mc_qc
  experiment_version: null
  make_figures: true
  overwrite: true
