# GPR panels for the energy x gantry smoke test (run after generation).
#   uv run python scripts/mc/plot_angle_robustness.py \
#       --config scripts/mc/config_plot_energy_gantry_smoke.yaml
#
# Same figure as the paper panels, on the 3x3 lattice of the smoke test: 5 filled
# cells (4 corners + centre), 4 empty edge-midpoints. One panel per
# (patient, energy, gantry) = 36 panels; `--mode aggregate` instead gives the mean
# per cell across a site's patients AND gantries (one panel per anatomy x energy).

model:
  name: DoTA_v3_grid_search_v11
  fname: best_model.pth
  device_index: 0

gamma_criteria:
  - {dose: 2, dist: 2, cutoff: 10}
  - {dose: 1, dist: 3, cutoff: 0.1}

grid_n: 3                  # must match the generation lattice
theta_range: [-2.0, 2.0]
mode: per_patient          # override with --mode aggregate

# Several dirs share (site, patient, energy) and differ only by field angle, so the
# gantry has to be part of every panel filename.
distinguish_gantry: true

cmap: viridis
emit:
  bare: true
  with_colorbar: true
  standalone_colorbar: true

render_examples: true
n_examples: 1              # 5 beamlets per panel; 1 worst + 1 best is enough
example_criterion: g2_2_10
example_beamlet_shape: true

input_glob: /scratch/mstryja/DoTA_dataset_v2/energy_gantry_smoke_*_v1
output_dir: /scratch/mstryja/DoTA_dataset_v2/energy_gantry_smoke_figures
