# Multi-patient beamlet-angle robustness (overnight experiment)
# ============================================================
#   uv run python scripts/mc/generate_patient_set.py \
#       --config scripts/mc/config_robustness_multipatient.yaml
#
# 5 thoracic (Lung-PET-CT-Dx) + 5 abdominal (StageII-Colorectal) patients, all at
# FIXED gantry 90 deg, 10x10 beamlet-angle grid, energies 80/120/140 MeV.
# Deliverables: per-patient GPR grids AND the mean pass rate across the 5 patients
# per energy (plot_angle_robustness.py `mode: aggregate`).
#
# Range is +/-1.5deg (not +/-2): at +/-2 the extreme corners walk out of the patient
# on thin thoracic CTs (dose in air). Patients are held-out (last-30 pool) AND screened
# so every corner deposits in the patient (min corner dep_ratio >= 0.9 at +/-1.5deg,
# worst-case 140 MeV). z-extent >= 260mm QC gate. Provenance:
# registry/robustness_clean_selection.csv (screen seed 20260823).

name: robustness_multipatient

datasets:
  - name: Lung-PET-CT-Dx           # thoracic held-out + screened clean at +/-1.5deg
    anatomy: thoracic
    root: /data/lung_cancer_dataset/manifest-1608669183333
    collection: Lung-PET-CT-Dx
    patient_ids: [Lung_Dx-G0035, Lung_Dx-G0051, Lung_Dx-G0036, Lung_Dx-G0060, Lung_Dx-G0048]
    qc: {min_slices: 70, max_spacing_xy: 1.5, max_spacing_z: 2.0, min_z_extent_mm: 260.0, min_xy_extent_mm: 330.0}
  - name: StageII-Colorectal       # abdominal held-out + screened clean at +/-1.5deg
    anatomy: abdominal
    root: /scratch/mstryja/manifest-1646429317311
    patient_ids: [StageII-Colorectal-CT-207, StageII-Colorectal-CT-227, StageII-Colorectal-CT-221, StageII-Colorectal-CT-206, StageII-Colorectal-CT-224]
    qc: {min_z_extent_mm: 260.0, min_xy_extent_mm: 330.0}

engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/robustness_edgetest
  bdl_file: hptc_beam_model_rsnone.txt
  scanner: default

robustness:
  energies: [140.0]
  theta_x_range: [-1.5, 1.5]
  theta_y_range: [-1.5, 1.5]
  grid_n: 10
  border_only: true            # corner + edge beamlets only (fast validation)
  gantry_mode: fixed             # same gantry for every patient
  gantry_value: 90.0
  roi_size: [60, 60, 320]
  iso_spacing_mm: 1.0
  num_primaries: 1.0e5
  num_threads: 0
  rng_seed: 0
  min_deposition_ratio: 0.5
  output_root: /scratch/mstryja/DoTA_dataset_v2
  experiment_prefix: robustness_multipatient_edgetest
  experiment_version: 2
  make_figures: false
  overwrite: false               # resumable
