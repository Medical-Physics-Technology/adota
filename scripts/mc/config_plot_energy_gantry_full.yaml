# GPR panels for the energy x gantry FULL run (run after generation).
#   setsid nohup uv run python scripts/mc/plot_angle_robustness.py \
#       --config scripts/mc/config_plot_energy_gantry_full.yaml \
#       > run_logs/energy_gantry_full_plot_$(date +%Y%m%d_%H%M%S).log 2>&1 < /dev/null &
#
# The paper's panels on the full 18x18 lattice: one per (patient, energy, gantry) =
# 36 panels of 324 cells. Inference is GPU-bound and gamma runs a CPU pool per dir,
# so budget hours, not minutes. The per-site means come from
# config_plot_energy_gantry_full_aggregate.yaml, which re-renders from the grids this
# pass saves (seconds, no GPU).

model:
  name: DoTA_v3_grid_search_v11
  fname: best_model.pth
  device_index: 0

gamma_criteria:
  - {dose: 2, dist: 2, cutoff: 10}
  - {dose: 1, dist: 3, cutoff: 0.1}

grid_n: 18                 # must match the generation lattice
theta_range: [-2.0, 2.0]
mode: per_patient          # override with --mode aggregate

# Several dirs share (site, patient, energy) and differ only by field angle, so the
# gantry has to be part of every panel filename.
distinguish_gantry: true

cmap: viridis
emit:
  bare: true
  with_colorbar: true
  standalone_colorbar: true

render_examples: true
n_examples: 3              # 3 worst + 3 best per panel, as in the paper figures
example_criterion: g2_2_10
example_beamlet_shape: true

input_glob: /scratch/mstryja/DoTA_dataset_v2/energy_gantry_full_*_v1
output_dir: /scratch/mstryja/DoTA_dataset_v2/energy_gantry_full_figures
