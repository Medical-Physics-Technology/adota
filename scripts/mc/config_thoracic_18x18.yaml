# Full 18x18 robustness run: one thoracic patient (LUNG1-006), 3 energies.
# Matches the original script (18x18 grid over [-2,2] deg, ROI (60,60,320),
# 1e7 primaries), at the validated gantry=90 BEV frame.
#   nohup uv run python scripts/mc/beamlet_angle_robustness.py \
#       --config scripts/mc/config_thoracic_18x18.yaml > run_logs/... &
name: robustness_thoracic_lung006

datasets:
  - name: NSCLC-Radiomics
    anatomy: thoracic
    root: /scratch/mstryja/manifest-1603198545583
    patient_ids: [LUNG1-006]

engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/robustness
  bdl_file: hptc_beam_model_rsnone.txt

robustness:
  energies: [80.0, 120.0, 140.0]
  theta_x_range: [-2.0, 2.0]
  theta_y_range: [-2.0, 2.0]
  grid_n: 18                     # 18x18 = 324 angles
  gantry_mode: fixed
  gantry_value: 90.0
  roi_size: [60, 60, 320]
  iso_spacing_mm: 1.0
  num_primaries: 1.0e7           # as in the original script
  num_threads: 0                 # all available cores
  rng_seed: 0
  min_deposition_ratio: 0.5
  output_root: /scratch/mstryja/DoTA_dataset_v2
  experiment_version: 2
  make_figures: false            # 324x3 figures would be excessive; add --make-figures to enable
  overwrite: false               # resumable
