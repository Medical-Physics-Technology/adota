# Water-phantom MC dataset generation (homogeneous-medium control for R3)
# =======================================================================
#   uv run python scripts/mc/generate_phantom_set.py \
#       --config scripts/mc/config_phantom.yaml
#
# Sweeps synthetic phantoms over the SAME beamlet-angle grid / energies / ROI / QA
# as the real-CT robustness run (scripts/mc/config_beamlet_angle_robustness.yaml),
# so the water phantom is a directly comparable homogeneous baseline.
# CLI flags override: --grid-n 3 --make-figures for a QC run.

name: water_phantom

# --- Phantom set: one entry per synthetic phantom ---------------------------
# kind: "water" = homogeneous water box; air_layer_depth adds an air shell (mm on
# every face, 0 = plain water). `name` labels the output dir (patient_id slot).
# Future high-density slab phantoms will add new `kind`s in src/datasets/phantom.py
# and appear here as extra entries -- no script change needed.
phantoms:
  - kind: water
    name: air50mm             # -> water_phantom_phantom_air50mm_e{E}_v{ver}
    size: [400, 400, 250]     # voxels (x, y, z); x = beam-depth axis (holds 320 ROI)
    spacing: [1.0, 1.0, 1.0]  # mm
    origin: [0.0, 0.0, 0.0]
    water_hu: 0
    air_hu: -1024
    air_layer_depth: 50       # mm air shell on all faces (matches water_phantom_grid.py)

# --- MCsquare engine (independent install; working dir on /scratch) ---------
engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/phantom
  bdl_file: hptc_beam_model_rsnone.txt
  scanner: default

# --- Sweep (reuses RobustnessConfig; identical knobs to the real-CT run) -----
robustness:
  energies: [80.0, 120.0, 140.0]  # same layers as the thoracic/abdominal test-set runs
  theta_x_range: [-2.0, 2.0]
  theta_y_range: [-2.0, 2.0]
  grid_n: 18                     # 18x18 = 324 angles; use --grid-n 3 for QC
  gantry_mode: fixed
  gantry_value: 90.0
  roi_size: [60, 60, 320]
  iso_spacing_mm: 1.0
  num_primaries: 1.0e6
  num_threads: 0                 # 0 = all available
  rng_seed: 0
  min_deposition_ratio: 0.5      # QA: fraction of plan dose captured in the ROI
  output_root: /scratch/mstryja/DoTA_dataset_v2
  experiment_prefix: water_phantom
  experiment_version: 2
  make_figures: false            # per-beamlet QC figures (heavy at full grid)
  overwrite: false               # resumable: skip angles already written
