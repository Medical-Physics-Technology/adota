# Full 18x18 robustness generation: one abdominal patient (StageII-Colorectal-CT-101,
# held-out: index >100, training used <=100), 3 energies.
# NOTE: StageII-Colorectal-CT is uniformly 5.0 mm slice thickness (pixel <1.5 mm);
# the abdominal training used this same 5 mm collection. Resampled to 1 mm iso.
name: robustness_abdominal_colorectal101

datasets:
  - name: StageII-Colorectal
    anatomy: abdominal
    root: /scratch/mstryja/manifest-1646429317311
    collection: StageII-Colorectal-CT
    patient_ids: [StageII-Colorectal-CT-101]

engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/robustness
  bdl_file: hptc_beam_model_rsnone.txt

robustness:
  energies: [80.0, 120.0, 140.0]
  theta_x_range: [-2.0, 2.0]
  theta_y_range: [-2.0, 2.0]
  grid_n: 18
  gantry_mode: fixed
  gantry_value: 90.0
  roi_size: [60, 60, 320]
  iso_spacing_mm: 1.0
  num_primaries: 1.0e7
  num_threads: 0
  rng_seed: 0
  min_deposition_ratio: 0.5
  output_root: /scratch/mstryja/DoTA_dataset_v2
  experiment_version: 2
  make_figures: false
  overwrite: false
