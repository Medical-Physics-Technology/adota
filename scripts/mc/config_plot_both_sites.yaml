# Combined robustness figure generation: thoracic (LUNG1-006) + abdominal (CRC-101),
# 3 energies each. Organized run-dir layout; robust shared colorbar scale.
model: {name: DoTA_v3_grid_search_v11, fname: best_model.pth, device_index: 1}
gamma_criteria:
  - {dose: 2, dist: 2, cutoff: 10}
  - {dose: 1, dist: 3, cutoff: 0.1}
grid_n: 18
theta_range: [-2.0, 2.0]
mode: per_patient
cmap: viridis
emit: {bare: true, with_colorbar: true, standalone_colorbar: true}
render_examples: true
n_examples: 3
example_criterion: g2_2_10
example_beamlet_shape: true
# Robust, stable shared scale: vmin = 2nd percentile of pooled GPR (a few low
# outliers don't wash out the high-GPR bulk), vmax capped at 100.
scale_low_percentile: 2.0
inputs:
  - /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_thoracic_LUNG1-006_e80_v2
  - /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_thoracic_LUNG1-006_e120_v2
  - /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_thoracic_LUNG1-006_e140_v2
  - /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_abdominal_StageII-Colorectal-CT-101_e80_v2
  - /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_abdominal_StageII-Colorectal-CT-101_e120_v2
  - /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_abdominal_StageII-Colorectal-CT-101_e140_v2
output_dir: /scratch/mstryja/DoTA_dataset_v2/robustness_figures_combined
