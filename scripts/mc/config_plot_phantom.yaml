# GPR grids for the water-phantom control (air50mm), energies 80/120/140 MeV.
# Single phantom -> per_patient gives one panel per energy (no aggregate needed).
#   uv run python scripts/mc/plot_angle_robustness.py --config scripts/mc/config_plot_phantom.yaml

model:
  name: DoTA_v3_grid_search_v11
  fname: best_model.pth
  device_index: 0

gamma_criteria:
  - {dose: 2, dist: 2, cutoff: 10}
  - {dose: 1, dist: 3, cutoff: 0.1}

grid_n: 18
theta_range: [-2.0, 2.0]
mode: per_patient

cmap: viridis
emit:
  bare: true
  with_colorbar: true          # per-figure colorbar
  standalone_colorbar: true

render_examples: false

inputs:
  - /scratch/mstryja/DoTA_dataset_v2/water_phantom_phantom_air50mm_e80_v2
  - /scratch/mstryja/DoTA_dataset_v2/water_phantom_phantom_air50mm_e120_v2
  - /scratch/mstryja/DoTA_dataset_v2/water_phantom_phantom_air50mm_e140_v2

output_dir: /scratch/mstryja/DoTA_dataset_v2/robustness_figures_phantom
