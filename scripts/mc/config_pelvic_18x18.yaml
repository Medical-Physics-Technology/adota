# Full 18x18 robustness generation: one pelvic patient (Prostate-AEC-001), 3 energies.
# Mirrors config_thoracic_18x18.yaml (18x18 grid, ROI (60,60,320), 1e7 primaries,
# gantry=90 validated BEV frame).
name: robustness_pelvic_aec001

datasets:
  - name: Prostate-AEC
    anatomy: pelvic
    root: /scratch/mstryja/manifest-1684259732535
    patient_ids: [Prostate-AEC-001]

engine:
  mcsquare_install: /home/mstryja/tools/mcsquare
  mc_work_dir: /scratch/mstryja/mc_work/robustness
  bdl_file: hptc_beam_model_rsnone.txt

robustness:
  energies: [80.0, 120.0, 140.0]
  theta_x_range: [-2.0, 2.0]
  theta_y_range: [-2.0, 2.0]
  grid_n: 18
  gantry_mode: fixed
  gantry_value: 90.0
  roi_size: [60, 60, 320]
  iso_spacing_mm: 1.0
  num_primaries: 1.0e7
  num_threads: 0
  rng_seed: 0
  min_deposition_ratio: 0.5
  output_root: /scratch/mstryja/DoTA_dataset_v2
  experiment_version: 2
  make_figures: false
  overwrite: false
