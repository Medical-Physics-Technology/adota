# Beamlet-angle robustness GPR grid panels (reviewer R3).
#   uv run python scripts/mc/plot_angle_robustness.py --config scripts/mc/config_plot_angle_robustness.yaml
#
# Shared color scale per gamma criterion across ALL comparable panels; panels
# saved separately for LaTeX; no titles (caption covers); A4-legible fonts.

model:
  name: DoTA_v3_grid_search_v11
  fname: best_model.pth
  device_index: 0

# Gamma criteria (dose% / distance-mm / low-dose-cutoff%) -- matches the paper panels.
gamma_criteria:
  - {dose: 2, dist: 2, cutoff: 10}
  - {dose: 1, dist: 3, cutoff: 0.1}

grid_n: 18
theta_range: [-2.0, 2.0]

# per_patient = one panel per (patient, energy); aggregate = per-cell mean across
# a site's patients -> one panel per (anatomy, energy).
mode: per_patient

cmap: viridis

# Which panel variants to write (configurable, as requested):
emit:
  bare: true                 # panel with no colorbar (for a LaTeX grid + one shared bar)
  with_colorbar: true        # panel carrying the shared-scale colorbar
  standalone_colorbar: true  # the shared colorbar alone, one per criterion

# Best/worst beamlet example figures (publication_figure) alongside each grid.
render_examples: true
n_examples: 3                # 3 lowest + 3 highest GPR beamlets per panel
example_criterion: g2_2_10   # rank by this criterion's key
example_beamlet_shape: true  # include the CT+flux beamlet-shape row

# Experiment dirs to include (explicit list and/or a glob).
inputs: []
input_glob: /scratch/mstryja/DoTA_dataset_v2/beamlet_angle_robustness_*_v2

output_dir: /scratch/mstryja/DoTA_dataset_v2/robustness_figures
