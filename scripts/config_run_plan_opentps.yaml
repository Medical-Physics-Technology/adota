# ADoTA End-to-End Plan Pipeline Configuration
# =============================================
# Configures scripts/run_plan_opentps.py. Every key corresponds to a CLI
# option and can be overridden on the command line (CLI takes precedence).
#
# Usage:
#   uv run python scripts/run_plan_opentps.py --config scripts/config_run_plan_opentps.yaml
#
# To run detached: 
#   nohup uv run python scripts/run_plan_opentps.py --config scripts/config_run_plan_opentps.yaml > run_logs/<experiment_name>.log 2>&1 &
# 
# A copy of this file is saved in the run directory for reproducibility.

# --- Required ---

# OpenTPS plan directory: CT.mhd, PlanPencil.txt, bdl.txt, config.txt,
# structure masks (target.mhd / OAR_*.mhd), and the MC reference Dose.mhd.
plan_dir: /scratch/mstryja/opentps_plans/LUNG1-364_Publication_Plan_5

# Model directory name under models/.
model_name: DoTA_v3_grid_search_v11

# --- Optional ---

# Model weights filename within the model directory.
model_fname: best_model.pth

# Beam data library path. Leave null to use the plan-local bdl.txt
# (the BDL is fine-tuned and request-only; it is not committed to the repo).
bdl_path: null

# CUDA device index (-1 for CPU).
device_index: 1

# Base directory for run outputs (kept on /scratch, never under /home).
runs_dir: /scratch/mstryja/tmp_adota/runs

# Preview verbosity: how much of the parsed plan tree to expand.
max_fields: 10
max_control_points: 10000

# --- Pipeline stages ---

# Comma-separated stages to run end to end.
# extract  -> per-spot CT crops + flux projections under adota_beamlets/
# infer    -> batched ADoTA inference -> {id}_ds_pred.npy
# accumulate -> deposit predicted dose back into the grid -> Dose_ADoTA.mhd
# gamma    -> plan gamma pass rate (per criterion) + MAPE/RMSE/RDE metrics +
#             gamma_comparison figure; runs after the timing table, reusing
#             Dose_ADoTA.mhd (can run standalone if accumulate already ran).
# stream   -> FUSED, disk-free alternative to extract+infer+accumulate: streams
#             each field's spots through crop -> flux -> infer -> deposit in one
#             pass, never writing beamlets (bounded memory, ~2x faster). Produces
#             the same Dose_ADoTA.mhd + comparison/DVH figures. Use e.g.
#             `stages: stream,gamma`. The staged path stays available for research.
# ("compare" against the MC Dose.mhd is a later stage.)
stages: stream # extract,infer,accumulate # ,gamma

# Subset controls for cheap runs (null = all).
# n_spots: extract only the first N spots (global order).
# beams: comma-separated beam (field) indices, e.g. "0".
n_spots: null
beams: null

# Allow re-extracting into a non-empty <plan_dir>/adota_beamlets/ directory.
overwrite: true

# Skip the per-field overlay PNGs (visual sanity check).
no_overlays: true

# Extraction: compute the per-spot flux projection on the GPU (flux_projection_gpu)
# instead of NumPy. Numerically identical (float64; proven by tests/beamlets/
# test_flux_gpu.py); purely a speed option. Uses the device from device_index.
flux_on_gpu: true

# Extraction parallelism. false -> run_extraction (serial reference, kept for
# comparison). true -> run_extraction_pooled (thread pool over each field's spots;
# bit-identical output, proven by tests/beamlets/test_extraction_pooled.py).
# extraction_workers: thread count (0 = auto, min(32, os.cpu_count())).
extraction_parallel: true
extraction_workers: 0

# Inference: spots per forward pass (batched on the GPU).
# 120 is the measured sweet spot for the stream stage with batched I/O enabled
# below (56 / 120 / 240 / 360 swept on LUNG1-062: compute 3.28 / 2.86 / 3.28 /
# 2.97 s). Past ~120 the forward stops getting cheaper and the pinned staging
# buffers just grow, so bigger is not better.
batch_size: 120

# --- Batched host<->device staging (stream stage) -----------------------------
# Ported from the optimized-GPU reinterpretation benchmark (scripts/
# reinterp_gpu_benchmark.py). The per-spot path moved 2 arrays per beamlet across
# the PCIe bus one at a time; these two options move each batch as a single
# contiguous block instead.
#
# flux_batched: build the whole batch's flux in ONE flux_projection_gpu_batched
#   call and (with batched_prep) keep the result resident on the device, so it
#   never makes a device -> host -> device round trip. Measured on LUNG1-062:
#   flux 1.502 s -> 0.019 s.
# batched_prep: stage the batch's CT crops into one contiguous pinned block and
#   copy them host-to-device ONCE instead of batch_size times, then normalize /
#   permute / resize over the batch. Measured: prep 4.983 s -> 0.097 s. This one
#   is BIT-IDENTICAL end to end (verified on a real plan: zero differing voxels
#   in both fp16 and fp32), because it only changes how the batch reaches the GPU.
# flux_batched_dtype: compute dtype of the batched flux. "float64" (default)
#   evaluates the same float64 math as the per-spot flux_projection_gpu, only for
#   the whole batch at once, so it agrees to round-off (<1 float32 ulp on the
#   normalized channel the model consumes). "float32" is ~2x faster on the flux
#   alone but an order of magnitude looser; not used for publication runs.
#
# Note the batched flux is a reassociation, so it is NOT bit-identical: on
# LUNG1-062 it shifts the plan dose by 1.5e-5 of the peak in fp32, which the fp16
# forward amplifies to 1.8e-4 (0.018%) -- 16x below the ~0.3% fp16 already
# accepted above, with gamma pass rates unchanged (see the A/B in run_logs/).
flux_batched: true
batched_prep: true
flux_batched_dtype: float64

# Field-level resampling factor (optional; stream stage). Default 1 = the current
# per-beamlet 1mm path (byte-identical). 2 = rotate/crop/flux/deposit on a 2x2x2
# (2mm) grid so the per-beamlet down/up-sample is replaced by a single per-field
# rotate/de-rotate -- ~2.6x faster streaming with the dose preserved (voxel
# correlation >0.999, dose-weighted centroid shift <0.1mm, integral within ~0.3%
# vs the 1mm path on LUNG1-221). Surfaced as a distinct mode ("Nmm field") in
# pipeline_timing.json. Validated per-plan before adoption (see the grid_factor
# A/B harness); leave at 1 unless explicitly running the 2mm comparison.
grid_factor: 2

# Forward-pass precision for the STREAM stage. "fp32" (default) = full precision,
# unchanged. "fp16" wraps only the model forward in CUDA autocast (the prediction
# is cast back to fp32 before deposit, so accumulation is unchanged) -- a large
# speed-up on the GPU forward. fp16 is a no-op on CPU. Validate the dose (gamma vs
# MC) before adopting; benchmark showed ~2.6x on the forward at ~0.3% max-rel.
precision: fp16

# Accumulation: which per-spot array to deposit as "dose".
# Leave null to auto-select: "prediction" (the ADoTA model output) when the
# infer stage runs, otherwise "flux" (the constructed flux projection stand-in).
# Set explicitly to "flux" or "prediction" to force.
dose_source: null

# Dose-comparison figure style (dose_comparison.*). "image" (default) renders each
# dose column as the filled jet overlay on the CT (ax.imshow). "contour" renders
# them as clinical filled isodose contours (ax.contourf) at 10/30/50/70/90/95/100%
# of the shared peak, with labeled isodose lines on top. The difference column stays
# an imshow heatmap in both modes. Affects the accumulate and stream stages.
dose_render: contour

# dose_comparison.* colorbars. false (default) -> two colorbars: a shared dose scale
# (ADoTA + MCsquare) and a separate signed-difference scale auto-zoomed to the error
# (highlights where the error is). true -> a SINGLE colorbar (the shared dose scale):
# the difference panel shows the ABSOLUTE error |ADoTA - MCsquare| on that same
# 0->peak dose scale, so a small error sinks to the bottom of the scale and reads as
# negligible relative to the dose (the signed numbers stay in the caption).
single_colorbar: false

# Dose calibration (optional). The model systematically under-predicts each
# beamlet's integral by ~2.8% (measured on held-out beamlets, std <1%), which
# accumulates into a ~2.8% plan-level target underdosage. When enabled, the
# accumulated dose is multiplied by dose_calibration_factor before Dose_ADoTA.mhd
# is written, so the figure, DVH and gamma all use the calibrated dose.
# Disabled by default -> the pipeline is unchanged. ~1.029 = 1 / 0.972.
dose_calibration_enabled: false
dose_calibration_factor: 1.029

# --- Gamma stage ---

# Gamma pass-rate criteria, each as [dose_difference_%, distance_mm, dose_cutoff_%].
# One figure column + one pass rate is produced per criterion.
gamma_criteria:
  - [1, 1, 10]
  - [2, 2, 10]
  - [3, 3, 10]
  - [1, 2, 3]
  - [1, 3, 0.1]

# Extra pymedphys gamma parameters, merged over the defaults (and over the
# per-criterion dose/distance/cutoff above). Lower interp_fraction = faster but
# slightly less precise; the plan stage defaults to 5 (vs 10 per-beamlet).
gamma_params:
  interp_fraction: 5
  max_gamma: 2
  local_gamma: false
  random_subset: null

# Enable verbose/debug logging.
verbose: false
