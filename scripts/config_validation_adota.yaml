# ============================================================
# ADoTA Cross-Run Validation Experiment (validation_adota.py)
# ============================================================
#
# Evaluates several trained runs on ONE shared validation set (identical
# records) and prints/saves a Run x Metric table (mean +/- std). Inference only.
#
# PER-RUN INPUT ENCODING (important for the projection ablation):
#   The second input channel (flux_mode) is resolved PER RUN, so a model trained
#   with a different encoding (e.g. centerline_fixed) is evaluated with the
#   channel it was actually trained on. Precedence for each run:
#       run.flux_mode  >  the run's saved config.yaml  >  the experiment default.
#   In practice, just list the run: its flux_mode/centerline_sidecar are read
#   from the run directory automatically. The shared records are the same for
#   every run; only the input channel differs.
#
# Usage:
#   uv run python scripts/validation_adota.py --config scripts/config_validation_adota.yaml
# ============================================================

# ── Shared validation set (same records for every run) ──────
dataset_path: /scratch/mstryja/DoTA_dataset_v2/trainset_pelvis_initial_test_one_ct_downsampled_v2_all_SingleGaussian.h5
excluded_indexes_file: /home/mstryja/projects/dota_pytorch/auxilary_files/IndexesExclude_trainset_pelvis_initial_test_one_ct_downsampled_v2_all_SingleGaussian.txt
train_test_split: 0.2
split_random_state: 42
normalize_flux_only: true

# Experiment-level default input encoding (used only when a run neither sets
# flux_mode nor has it in its saved config.yaml). Each centerline run reads its
# line params from centerline_sidecar (also auto-detected from the run config).
flux_mode: analytical
centerline_sidecar: /scratch/mstryja/DoTA_dataset_v2/centerline_params_trainset_pelvis_initial_test_one_ct.csv

# Dose / CT / energy MinMax scaling. MUST match the dataset generation AND the
# scaling the listed runs were trained with.
scale:
  min_ds: 0.0
  max_ds: 25277028.0
  min_ct: -1024
  max_ct: 3071
  min_energy: 70.0
  max_energy: 270.0

# ── Reporting methodology ───────────────────────────────────
# For the projection ablation we use inference mode: it builds each run's input
# with its own flux_mode and additionally computes range errors (R80/R20/DFW),
# which the reviewer asked for. (logs mode reads each run's metrics.jsonl at the
# min-val-MAPE epoch instead; there flux_mode is irrelevant because the metrics
# were already logged on the run's own input, but range errors are unavailable.)
report_mode: inference
select_by: val_mape   # only used by logs mode

# For inference at the paper's selection point, point this at the min-val-MAPE
# checkpoint if the run saved one (best_mape.pth); otherwise best.pth.
checkpoint_fname: best.pth

# ── Runs to compare (projection ablation: encoding spectrum) ──
# flux_mode is auto-detected from each run's config.yaml, so it is not set here.
# All share the architecture / loss / split; they differ only in the second
# input channel:
#   baseline (config_A) -> analytical (energy-conditioned Gaussian projection)
#   E                   -> centerline_fixed  (constant-width smooth tube)
#   F                   -> centerline_binary (single nearest-voxel line)
runs:
  - name: baseline_analytical
    run_dir: /scratch/mstryja/adota_runs/train_20260519_231135_baseline
    # flux_mode: analytical            # (auto-detected)
  - name: ablation_E_centerline_fixed
    run_dir: /scratch/mstryja/adota_runs/train_20260808_195550_ablation_E_centerline_fixed_mse_idd
    # flux_mode: centerline_fixed      # (auto-detected)
  - name: ablation_F_centerline_binary
    run_dir: /scratch/mstryja/adota_runs/train_20260811_094145_ablation_F_centerline_binary_mse_idd
    # flux_mode: centerline_binary     # (auto-detected)

# ── Evaluation control ──────────────────────────────────────
device_index: 1
batch_size: 100        # batched inference (eval mode => results batch-invariant)
num_workers: 4        # DataLoader workers for parallel H5 reads
n_samples: ~          # null = whole val set; set small (e.g. 20) for a quick run
mape_mask_frac: 0.1   # MAPE mask: y_pred > frac * max(y_pred)
strict_split_check: true  # error on split/scale mismatch (false = warn + continue)

# ── Range-metric extraction (range_metrics.compute_range_metrics) ──
range_dz_mm: 2.0
range_oversample: 20
range_min_peak_dose: 0.0

# ── Output ──────────────────────────────────────────────────
output_dir: /scratch/mstryja/adota_runs/validation_experiments
experiment_name: projection_ablation_centerline_fixed_vs_analytical